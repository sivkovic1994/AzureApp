name: Trigger auto deployment for ordermgmt-api

# When this action will be executed
on:
  # Automatically trigger it when detected changes in repo
  push:
    branches: 
      [ master ]
    paths:
    - '**'
    - '.github/workflows/ordermgmt-api-AutoDeployTrigger-e0e9df14-c0b3-4793-ab62-6d8cf1224296.yml'

  # Allow manual trigger 
  workflow_dispatch:      

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions: 
      id-token: write #This is required for requesting the OIDC JWT Token
      contents: read #Required when GH token is used to authenticate with private repo

    steps:
      - name: Checkout to the branch
        uses: actions/checkout@v2

      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.ORDERMGMTAPI_AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.ORDERMGMTAPI_AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.ORDERMGMTAPI_AZURE_SUBSCRIPTION_ID }}

      - name: Build and push container image to registry
        uses: azure/container-apps-deploy-action@v2
        with:
          appSourcePath: ${{ github.workspace }}
          _dockerfilePathKey_: _dockerfilePath_
          _targetLabelKey_: _targetLabel_
          registryUrl: docker.io
          registryUsername: ${{ secrets.ORDERMGMTAPI_REGISTRY_USERNAME }}
          registryPassword: ${{ secrets.ORDERMGMTAPI_REGISTRY_PASSWORD }}
          containerAppName: ordermgmt-api
          resourceGroup: ordermgmt-rg
          imageToBuild: sladjan944/ordermgmt-api:${{ github.sha }}
          _buildArgumentsKey_: |
            _buildArgumentsValues_


